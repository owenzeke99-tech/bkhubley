<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05030a">

<title>Bk's Hub</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --purple: #9b5cff;
    --purple-light: #c084fc;
    --purple-dark: #5b21b6;
    --black: #030207;
    --card: rgba(12, 7, 20, .82);
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Inter, Arial, sans-serif;
    color: #fff;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(124, 58, 237, .11),
            transparent 34%
        ),
        #030207;
}

/* =========================================
   BACKGROUND
========================================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

/* Very slow background movement */
.animated-bg {
    position: absolute;
    inset: -20%;

    background:
        radial-gradient(
            circle at 25% 25%,
            rgba(139, 92, 246, .09),
            transparent 25%
        ),
        radial-gradient(
            circle at 75% 75%,
            rgba(168, 85, 247, .07),
            transparent 25%
        );

    animation:
        backgroundDrift 24s ease-in-out infinite alternate;
}

@keyframes backgroundDrift {
    0% {
        transform: translate3d(-1%, -1%, 0) scale(1);
    }

    50% {
        transform: translate3d(1%, 1%, 0) scale(1.025);
    }

    100% {
        transform: translate3d(-1%, 2%, 0) scale(1.015);
    }
}

/* =========================================
   SOFT GLOW
========================================= */

.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    will-change: transform;
}

.glow-1 {
    width: 400px;
    height: 400px;

    left: -190px;
    top: -190px;

    background: #7c3aed;
    opacity: .15;

    animation:
        glowMoveOne 18s ease-in-out infinite alternate;
}

.glow-2 {
    width: 400px;
    height: 400px;

    right: -190px;
    bottom: -190px;

    background: #9333ea;
    opacity: .13;

    animation:
        glowMoveTwo 21s ease-in-out infinite alternate;
}

.glow-3 {
    width: 220px;
    height: 220px;

    left: 50%;
    top: 15%;

    transform: translateX(-50%);

    background: #c084fc;
    opacity: .055;

    animation:
        glowBreathing 10s ease-in-out infinite;
}

@keyframes glowMoveOne {
    0% {
        transform: translate3d(0, 0, 0) scale(1);
    }

    50% {
        transform: translate3d(70px, 55px, 0) scale(1.06);
    }

    100% {
        transform: translate3d(110px, 80px, 0) scale(1.12);
    }
}

@keyframes glowMoveTwo {
    0% {
        transform: translate3d(0, 0, 0) scale(1);
    }

    50% {
        transform: translate3d(-65px, -50px, 0) scale(1.05);
    }

    100% {
        transform: translate3d(-100px, -75px, 0) scale(1.1);
    }
}

@keyframes glowBreathing {
    0%,
    100% {
        opacity: .035;
        transform: translateX(-50%) scale(.9);
    }

    50% {
        opacity: .075;
        transform: translateX(-50%) scale(1.12);
    }
}

/* =========================================
   GRID
========================================= */

.grid {
    position: absolute;
    inset: 0;

    opacity: .065;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size: 60px 60px;

    animation:
        gridDrift 35s linear infinite;
}

@keyframes gridDrift {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 60px 60px;
    }
}

/* =========================================
   PARTICLES
========================================= */

.particle {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #c084fc;

    box-shadow:
        0 0 7px rgba(192,132,252,.7);

    opacity: 0;

    animation:
        particleFloat linear infinite;
}

@keyframes particleFloat {

    0% {
        transform:
            translate3d(0, 105vh, 0)
            scale(.4);

        opacity: 0;
    }

    15% {
        opacity: .35;
    }

    50% {
        transform:
            translate3d(20px, 50vh, 0)
            scale(.8);
    }

    80% {
        opacity: .25;
    }

    100% {
        transform:
            translate3d(-15px, -8vh, 0)
            scale(.5);

        opacity: 0;
    }
}

/* =========================================
   SOFT LIGHT STREAK
========================================= */

.light-streak {
    position: absolute;

    width: 110px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(192,132,252,.5),
            transparent
        );

    opacity: 0;

    transform: rotate(-30deg);

    animation:
        lightSweep 12s ease-in-out infinite;
}

.light-streak.one {
    top: 22%;
    left: -130px;
}

.light-streak.two {
    top: 70%;
    left: -160px;
    animation-delay: 6s;
}

@keyframes lightSweep {

    0% {
        transform:
            translate3d(0,0,0)
            rotate(-30deg);

        opacity: 0;
    }

    8% {
        opacity: .35;
    }

    18% {
        transform:
            translate3d(125vw,0,0)
            rotate(-30deg);

        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================
   MAIN
========================================= */

.wrapper {
    position: relative;
    z-index: 20;

    width: min(92%, 500px);

    perspective: 1000px;
}

/* =========================================
   CARD
========================================= */

.card {
    position: relative;

    padding: 43px 34px 30px;

    border-radius: 31px;

    background:
        linear-gradient(
            145deg,
            rgba(23, 13, 38, .84),
            rgba(5, 3, 10, .91)
        );

    border:
        1px solid rgba(192,132,252,.17);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.72),
        0 0 80px rgba(124,58,237,.07),
        inset 0 1px 0 rgba(255,255,255,.07);

    animation:
        cardEnter 900ms cubic-bezier(.2,.8,.2,1) both,
        cardFloat 9s ease-in-out 1s infinite;
}

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 13%;
    right: 13%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(192,132,252,.8),
            transparent
        );

    box-shadow:
        0 0 16px rgba(168,85,247,.5);

    animation:
        topGlow 6s ease-in-out infinite;
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform:
            translate3d(0, 35px, 0)
            scale(.97);
    }

    to {
        opacity: 1;
        transform:
            translate3d(0, 0, 0)
            scale(1);
    }
}

@keyframes cardFloat {

    0%,
    100% {
        transform: translate3d(0, 0, 0);
    }

    50% {
        transform: translate3d(0, -4px, 0);
    }
}

@keyframes topGlow {

    0%,
    100% {
        opacity: .45;
    }

    50% {
        opacity: .9;
    }
}

/* =========================================
   LOGO AREA
========================================= */

.logo-area {
    position: relative;

    width: 118px;
    height: 118px;

    margin: 0 auto 27px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Outer ring */
.logo-ring {
    position: absolute;

    inset: -8px;

    border-radius: 35px;

    border:
        1px solid rgba(192,132,252,.27);

    box-shadow:
        0 0 22px rgba(139,92,246,.10);

    animation:
        ringBreathing 7s ease-in-out infinite;
}

/* Tiny orbit light */
.logo-ring::before {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    left: 50%;
    top: -4px;

    margin-left: -3.5px;

    border-radius: 50%;

    background: #d8b4fe;

    box-shadow:
        0 0 10px #c084fc,
        0 0 20px rgba(168,85,247,.6);

    animation:
        orbitSlow 9s linear infinite;
}

@keyframes ringBreathing {

    0%,
    100% {
        transform: scale(1);
        opacity: .45;
    }

    50% {
        transform: scale(1.045);
        opacity: .75;
    }
}

@keyframes orbitSlow {
    to {
        transform:
            rotate(360deg)
            translateY(61px)
            rotate(-360deg);
    }
}

/* =========================================
   B LOGO
========================================= */

.logo {
    position: relative;

    width: 108px;
    height: 108px;

    display: flex;
    align-items: center;
    justify-content: center;

    /* Perfectly centered */
    text-align: center;
    line-height: 1;

    border-radius: 31px;

    font-family:
        Orbitron,
        Inter,
        sans-serif;

    font-size: 60px;

    font-weight: 900;

    letter-spacing: 0;

    color: white;

    background:
        linear-gradient(
            145deg,
            #d8b4fe 0%,
            #a855f7 28%,
            #7c3aed 62%,
            #4c1d95 100%
        );

    border:
        1px solid rgba(255,255,255,.24);

    box-shadow:
        0 0 38px rgba(139,92,246,.35),
        0 20px 50px rgba(0,0,0,.52),
        inset 0 2px 0 rgba(255,255,255,.25),
        inset 0 -18px 35px rgba(0,0,0,.20);

    text-shadow:
        0 3px 14px rgba(0,0,0,.4);

    overflow: hidden;

    animation:
        logoFloat 7s ease-in-out infinite;
}

/* Smooth logo shine */
.logo::after {
    content: "";

    position: absolute;

    top: -40%;
    left: -80%;

    width: 40%;
    height: 180%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    transform: rotate(25deg);

    animation:
        logoShine 8s ease-in-out infinite;
}

@keyframes logoFloat {

    0%,
    100% {
        transform:
            translate3d(0,0,0);
    }

    50% {
        transform:
            translate3d(0,-5px,0);
    }
}

@keyframes logoShine {

    0%,
    55% {
        left: -80%;
    }

    75%,
    100% {
        left: 140%;
    }
}

/* =========================================
   TITLE
========================================= */

.title {
    position: relative;
    z-index: 5;

    text-align: center;

    font-family:
        Orbitron,
        Inter,
        sans-serif;

    font-size: 35px;

    font-weight: 900;

    letter-spacing: -1px;

    margin-bottom: 9px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #e9d5ff,
            #c084fc,
            #a855f7,
            #fff
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    animation:
        titleShine 9s linear infinite;
}

@keyframes titleShine {

    to {
        background-position:
            250% center;
    }
}

.subtitle {
    position: relative;
    z-index: 5;

    text-align: center;

    color: #8f849d;

    font-size: 13px;

    margin-bottom: 30px;
}

/* =========================================
   KEY
========================================= */

.key-container {
    position: relative;
    z-index: 5;

    margin-bottom: 15px;
}

.key-label {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 9px;
}

.key-label .left {
    color: #aaa0b5;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}

.key-label .active {
    color: #c084fc;

    font-size: 10px;
    font-weight: 700;

    opacity: .7;

    animation:
        activeSoftPulse 4s ease-in-out infinite;
}

@keyframes activeSoftPulse {

    0%,
    100% {
        opacity: .55;
    }

    50% {
        opacity: .9;
    }
}

.key-box {
    position: relative;

    width: 100%;
    min-height: 74px;

    display: flex;
    align-items: center;

    padding: 17px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(31,17,49,.75),
            rgba(6,3,12,.9)
        );

    border:
        1px solid rgba(168,85,247,.20);

    box-shadow:
        inset 0 0 25px rgba(139,92,246,.025),
        0 12px 30px rgba(0,0,0,.25);

    transition:
        border-color .4s ease,
        box-shadow .4s ease,
        transform .4s ease;
}

.key-box:hover {
    transform:
        translate3d(0,-2px,0);

    border-color:
        rgba(192,132,252,.42);

    box-shadow:
        0 0 28px rgba(139,92,246,.09),
        inset 0 0 25px rgba(139,92,246,.06);
}

.key {
    width: 100%;

    color: #f3e8ff;

    font-size: 13px;

    line-height: 1.55;

    font-weight: 600;

    word-break: break-all;

    user-select: text;
}

/* =========================================
   COPY BUTTON
========================================= */

.copy-btn {
    position: relative;
    z-index: 5;

    width: 100%;
    height: 58px;

    border: 0;
    border-radius: 17px;

    overflow: hidden;

    cursor: pointer;

    color: white;

    font-family: Inter, sans-serif;

    font-size: 14px;
    font-weight: 800;

    background:
        linear-gradient(
            100deg,
            #5b21b6,
            #7c3aed,
            #a855f7,
            #7c3aed,
            #5b21b6
        );

    background-size: 250% 100%;

    box-shadow:
        0 15px 35px rgba(109,40,217,.22),
        inset 0 1px 0 rgba(255,255,255,.20);

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}

/* Slow shine */
.copy-btn::before {
    content: "";

    position: absolute;

    top: -50%;
    left: -100%;

    width: 45%;
    height: 200%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.20),
            transparent
        );

    transform: rotate(22deg);

    animation:
        buttonShine 7s ease-in-out infinite;
}

@keyframes buttonShine {

    0%,
    60% {
        left: -100%;
    }

    78%,
    100% {
        left: 145%;
    }
}

.copy-btn:hover {

    transform:
        translate3d(0,-3px,0);

    box-shadow:
        0 18px 40px rgba(139,92,246,.30),
        0 0 25px rgba(168,85,247,.10);
}

.copy-btn:active {
    transform:
        scale(.985);
}

.button-text {
    position: relative;
    z-index: 5;
}

/* =========================================
   STATUS
========================================= */

.status {
    position: relative;
    z-index: 5;

    min-height: 19px;

    margin-top: 13px;

    text-align: center;

    color: #c084fc;

    font-size: 12px;
    font-weight: 700;

    opacity: 0;

    transform:
        translate3d(0,-4px,0);

    transition:
        opacity .4s ease,
        transform .4s ease;
}

.status.show {
    opacity: 1;

    transform:
        translate3d(0,0,0);
}

/* =========================================
   FOOTER
========================================= */

.footer {
    position: relative;
    z-index: 5;

    margin-top: 21px;
    padding-top: 19px;

    border-top:
        1px solid rgba(255,255,255,.05);

    text-align: center;

    color: #5f5369;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}

.footer b {
    color: #8f6aaa;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 520px) {

    .wrapper {
        width: 92%;
    }

    .card {
        padding: 35px 20px 26px;
        border-radius: 27px;
    }

    .logo-area {
        width: 100px;
        height: 100px;
    }

    .logo {
        width: 92px;
        height: 92px;

        border-radius: 27px;

        font-size: 50px;
    }

    .logo-ring {
        inset: -7px;
        border-radius: 30px;
    }

    .title {
        font-size: 28px;
    }

    .subtitle {
        margin-bottom: 25px;
    }

    .key-box {
        min-height: 68px;
        padding: 15px;
    }

    .key {
        font-size: 11px;
    }

    .copy-btn {
        height: 55px;
    }
}

/* =========================================
   REDUCE MOTION SUPPORT
========================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>


<body>

<!-- =========================================
     BACKGROUND
========================================= -->

<div class="background">

    <div class="animated-bg"></div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <div class="grid"></div>

    <div class="light-streak one"></div>
    <div class="light-streak two"></div>

    <!-- Smooth particles -->
    <span class="particle"
        style="left:4%;animation-duration:22s;animation-delay:1s;"></span>

    <span class="particle"
        style="left:13%;animation-duration:27s;animation-delay:5s;"></span>

    <span class="particle"
        style="left:24%;animation-duration:24s;animation-delay:2s;"></span>

    <span class="particle"
        style="left:36%;animation-duration:30s;animation-delay:8s;"></span>

    <span class="particle"
        style="left:48%;animation-duration:25s;animation-delay:4s;"></span>

    <span class="particle"
        style="left:61%;animation-duration:29s;animation-delay:9s;"></span>

    <span class="particle"
        style="left:73%;animation-duration:23s;animation-delay:3s;"></span>

    <span class="particle"
        style="left:85%;animation-duration:31s;animation-delay:7s;"></span>

    <span class="particle"
        style="left:94%;animation-duration:26s;animation-delay:11s;"></span>

</div>


<!-- =========================================
     MAIN CARD
========================================= -->

<div class="wrapper">

    <div class="card">

        <!-- LOGO -->
        <div class="logo-area">

            <div class="logo-ring"></div>

            <div class="logo">
                B
            </div>

        </div>


        <!-- TITLE -->
        <h1 class="title">
            Bk's Hub
        </h1>

        <p class="subtitle">
            Premium access key system
        </p>


        <!-- KEY -->
        <div class="key-container">

            <div class="key-label">

                <span class="left">
                    Your Key
                </span>

                <span class="active">
                    ● ACTIVE
                </span>

            </div>


            <div class="key-box">

                <div class="key" id="key">
                    BkhubKeyLhdiehd - GdksjejdiGduejbejejsjejeb
                </div>

            </div>

        </div>


        <!-- COPY BUTTON -->
        <button
            class="copy-btn"
            onclick="copyKey()"
        >

            <span
                class="button-text"
                id="buttonText"
            >
                Copy Key
            </span>

        </button>


        <!-- STATUS -->
        <div
            class="status"
            id="status"
        >
            ✓ Key copied successfully
        </div>


        <!-- FOOTER -->
        <div class="footer">
            <b>Bk's Hub</b>
            &nbsp;•&nbsp;
            Premium Key System
        </div>

    </div>

</div>


<script>

/* =========================================
   COPY KEY
========================================= */

function copyKey() {

    const key =
        document
        .getElementById("key")
        .innerText
        .trim();

    const buttonText =
        document.getElementById("buttonText");

    const status =
        document.getElementById("status");


    function copied() {

        buttonText.innerText =
            "Copied ✓";

        status.classList.add("show");

        setTimeout(() => {

            buttonText.innerText =
                "Copy Key";

            status.classList.remove("show");

        }, 2200);
    }


    function fallback() {

        const textarea =
            document.createElement("textarea");

        textarea.value = key;

        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        try {
            document.execCommand("copy");
        } catch (error) {}

        textarea.remove();

        copied();
    }


    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(key)
            .then(copied)
            .catch(fallback);

    } else {

        fallback();

    }
}

</script>
